<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="formulario de avaliação de produtos, com página de avaliação para confirmar o envio do formulário via botão submit">
    <meta name="author" content="Francisco Jonathan Sousa da Costa">

    <title>Formulário</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <link rel="stylesheet" href="estilos/formulario-grande.css">

    <!-- __________________________FONTES________________________________ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header id="cabecalho">

    </header>

    <main>
        <form method="get" action="avaliacao.html">
            <fieldset class="produtos">
                <label for="produto">Nome do produto*</label>

                <select name="produto" id="produto" required >
                    <option value="" disabled selected >Selecione um produto ...</option>
                </select>



            </fieldset>

            <fieldset class="pontuar">

                <label>Classificação Geral</label>

                <div class="estrelas">

                    <div class="estrela">
                        <label for="1">⭐</label>
                        <input type="radio" id="1" name="avaliar" value="1" required>
                    </div>

                    <div class="estrela">
                        <label for="2">⭐⭐</label>
                        <input type="radio" id="2" name="avaliar" value="2" required>
                    </div>

                    <div class="estrela">
                        <label for="3">⭐⭐⭐</label>
                        <input type="radio" id="3" name="avaliar" value="3" required>
                    </div>

                    <div class="estrela">
                        <label for="4">⭐⭐⭐⭐</label>
                        <input type="radio" id="4" name="avaliar" value="4" required>
                    </div>

                    <div class="estrela">
                        <label for="5">⭐⭐⭐⭐⭐</label>
                        <input type="radio" id="5" name="avaliar" value="5" required>
                    </div>

                </div>

            </fieldset>


            <fieldset class="classificar">
                <label for="data">Data de Instalação*</label>
                <input type="date" id="data" name="data" required>

                <label for="durabilidade"></label>Quais recursos achou mais útil no produto? <br>
                    (Marque todos que se aplicam)

                <div class="checkbox">
                    <input type="checkbox" id="durabilidade" name="durabilidade" value="durabilidade">
                    <label for="durabilidade">Durabilidade</label>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="facilidade" name="facilidade" value="facilidade">
                    <label for="facilidade">Facilidade de Uso</label>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="desempenho" name="desempenho" value="desempenho">
                    <label for="desempenho">Desempenho</label>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="design" name="design" value="design">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <fieldset class="avaliar">
                <label for="texto">Avaliação Escrita (opcional)</label>

                <textarea name="texto" id="texto"></textarea>

                <label for="nome">Seu Nome (opcional)</label>
                <input type="text" id="nome" name="nome">
            </fieldset>

            <input type="submit" value="Publicar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="anoatual"></span> &#128526; Jonathan Costa &#128526; - Ceará</p>
        <p><span id="ultimaModificacao"></span></p>
    </footer>
</body>

</html>
